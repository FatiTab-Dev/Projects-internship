name: Deploy Task 1 and Task 3 to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # NODE.JS
      # =========================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # TASK 1
      # =========================

      - name: Install Task 1 dependencies
        working-directory: Task1-CodeAlpha_Simple_Ecommerce_Store/Front-end
        run: npm ci

      - name: Build Task 1
        working-directory: Task1-CodeAlpha_Simple_Ecommerce_Store/Front-end
        run: npm run build

      - name: Copy Task 1 build
        run: |
          mkdir -p site/task1
          cp -r Task1-CodeAlpha_Simple_Ecommerce_Store/Front-end/dist/. site/task1/

      # =========================
      # TASK 3
      # =========================

      - name: Install Task 3 dependencies
        working-directory: Task3-CodeAlpha/Front-end
        run: npm ci

      - name: Build Task 3
        working-directory: Task3-CodeAlpha/Front-end
        run: npm run build

      - name: Copy Task 3 build
        run: |
          mkdir -p site/task3
          cp -r Task3-CodeAlpha/Front-end/dist/. site/task3/

      # =========================
      # GITHUB PAGES
      # =========================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  # =========================
  # DEPLOY
  # =========================

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
